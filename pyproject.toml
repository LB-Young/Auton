[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "auton"
version = "0.1.0"
description = "A modular personal agent workbench — M01 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio>=4.8,<5",
  "apsw>=3.51.3,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "tokenizers>=0.22,<0.23",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
judgment = [
    "laya==0.3.20",
    "transformers>=4.48,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.3,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "playwright>=1.50,<2",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auton"]

[tool.ruff]
force-exclude = true
extend-exclude = ["src/auton/context/vendor"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts/export_contracts.py", "scripts/dev.py", "scripts/check_boundaries.py", "scripts/setup.py", "scripts/check_secrets.py", "scripts/model_smoke.py", "scripts/judgment_smoke.py", "scripts/download_laya.py", "scripts/download_context_tokenizers.py", "scripts/context_smoke.py", "scripts/agent_cli.py", "scripts/agent_smoke.py", "scripts/delegation_smoke.py", "scripts/evolution_smoke.py", "scripts/decision_review_smoke.py", "scripts/dataset_smoke.py", "scripts/operations_smoke.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires Chromium and running development servers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "auton"

[[tool.importlinter.contracts]]
name = "Kernel is independent"
type = "forbidden"
source_modules = ["auton.kernel"]
forbidden_modules = ["auton.bootstrap", "auton.demo", "auton.server", "auton.constitution", "auton.model", "auton.judgment", "auton.tools", "auton.genome", "auton.context", "auton.agent", "auton.experience", "auton.assess", "auton.delegation", "auton.evolve", "auton.decision_review", "auton.datasets", "auton.training", "auton.release", "auton.operations"]

[[tool.importlinter.contracts]]
name = "Demo never imports transport or composition"
type = "forbidden"
source_modules = ["auton.demo"]
forbidden_modules = ["auton.server", "auton.bootstrap", "auton.constitution"]

