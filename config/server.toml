# Preset for `make server`; only DEEPSEEK_API_KEY is supplied by the user.
profile = "dev"
implementation = "disabled"
allowed_origins = ["http://127.0.0.1:5173", "http://localhost:5173", "http://127.0.0.1:8000", "http://localhost:8000"]

[constitution]
remote_providers = ["deepseek"]

[models]
backend = "deepseek"
hosted_context_tokens = 65536
secret_reference = "DEEPSEEK_API_KEY"

[judgment]
backend = "laya"
application_enabled = false

[training]
backend = "disabled"

[decision_training]
backend = "disabled"

[operations]
enabled = false

# Practical interactive project budgets. Recorded per-run budgets remain immutable.
[agent]
max_steps = 20
max_tool_calls = 30
max_tokens = 100000
max_cost_microusd = 100000
max_output_tokens = 2048
